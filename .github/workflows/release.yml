name: release

# A v* tag publishes knowledge/ as marola-corpus-<tag>.tar.gz on that tag's GitHub release: the
# artifact marola pins in corpus.version (MIP-0070 §5.4). A tag's asset is immutable: a re-run
# that finds it already attached fails rather than replace what consumers have fetched.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  tarball:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: scripts/corpus-check.sh
      - name: build marola-corpus-${{ github.ref_name }}.tar.gz
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/corpus-tarball.sh "$TAG" .tmp
      - name: attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          file=".tmp/marola-corpus-$TAG.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$file"
          else
            gh release create "$TAG" "$file" --verify-tag --title "marola-corpus $TAG" \
              --notes "knowledge/ at $TAG. Consumers pin it in corpus.version."
          fi
